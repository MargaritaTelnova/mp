{% extends 'base.html' %}

{% block title %}Пароль восстановлен{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Пароль восстановлен</h3>
            </div>
            <div class="card-body">
                <p class="text-center text-success">Ваш пароль был успешно изменен.</p>
                <div class="text-center">
                    <a href="{% url 'login' %}" class="btn btn-primary">Войти с новым паролем</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
